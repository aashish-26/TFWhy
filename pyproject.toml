[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfwhy"
version = "0.1.0"
description = "A local-first Terraform plan explainer"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
tfwhy = "tfwhy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
